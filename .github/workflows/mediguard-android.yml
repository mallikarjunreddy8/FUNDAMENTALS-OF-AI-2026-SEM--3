# Builds the MediGuard Android app (APK) and publishes it as a GitHub Release.
# Every release has a higher version number; the app checks the latest release on start
# and offers the update (see MediGuard/android-app/www-extra/update.js).
name: MediGuard Android app

on:
  push:
    branches: [main, claude/fake-medicine-detection-agent-x106iq]
    paths:
      - "MediGuard/web/**"
      - "MediGuard/android-app/**"
      - ".github/workflows/mediguard-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mediguard-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MediGuard/android-app
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MediGuard/android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install
        run: npm ci

      - name: Web app tests
        run: node ../web/test/agent.test.js

      - name: Build the app's web files and copy them into Android
        run: |
          node scripts/build-www.js
          npx cap sync android

      - name: Release signing key (from the repository secrets, if set)
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIGUARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mediguard.keystore"
            echo "MEDIGUARD_KEYSTORE_FILE=$RUNNER_TEMP/mediguard.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No MEDIGUARD_KEYSTORE_BASE64 secret: signed with a temporary debug key, so future updates need an uninstall first."
          fi

      - name: Build the APK
        working-directory: MediGuard/android-app/android
        env:
          MEDIGUARD_KEYSTORE_PASSWORD: ${{ secrets.MEDIGUARD_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PappVersionCode=${{ github.run_number }} -PappVersionName=$APP_VERSION
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/MediGuard-$APP_VERSION.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: MediGuard-${{ env.APP_VERSION }}
          path: MediGuard/android-app/dist/*.apk

      - name: Publish the release (this is the update the app finds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" dist/MediGuard-$APP_VERSION.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "MediGuard $APP_VERSION" \
            --notes "MediGuard Android app $APP_VERSION.

          Install: open this page on your Android phone, tap MediGuard-$APP_VERSION.apk, then open the download and allow installing from this source.
          Already have the app? It shows an 'Update available' banner on start - tap Update.

          Built from commit $GITHUB_SHA."
